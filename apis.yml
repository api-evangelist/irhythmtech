name: Irhythmtech
description: >-
  iRhythm Technologies is a publicly traded (NASDAQ: IRTC) digital healthcare
  company specializing in ambulatory cardiac monitoring for the detection and
  management of heart arrhythmias. Its Zio service pairs a wearable single-lead
  ECG biosensor patch (Zio monitor and Zio AT) with FDA-cleared AI/deep-learning
  algorithms, qualified cardiac technician verification, and cloud-based data
  analytics to produce end-of-wear diagnostic reports for clinicians. The
  platform includes the ZioSuite clinician portal for report interpretation and
  patient management, the MyZio patient app for symptom logging and education,
  EHR integration, and telehealth workflows. iRhythm was surfaced as a portfolio
  company of Norwest Venture Partners and added to the API Evangelist network.
  It does not publish a public developer API or documentation portal; enrichment
  is limited to public identity, trust, and domain-security signals.
